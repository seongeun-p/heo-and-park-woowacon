<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>허앤박 우아콘 갤러리</title>
<style>
  :root {
    --bg: #000;
    --text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  header {
    padding: 56px 24px 32px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  main {
    padding: 0 24px 64px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #000;
    border-radius: 0;
    overflow: hidden;
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #000;
  }
  .thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: 0;
    pointer-events: none;
    transform-origin: top left;
  }
  .overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 45%;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.75) 100%);
    display: flex;
    align-items: flex-end;
    padding: 12px 14px;
  }
  .overlay .name {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  @media (max-width: 900px) {
    #grid { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>허앤박 우아콘 갤러리</h1>
</header>
<main>
  <div id="grid"></div>
</main>

<script>
async function main() {
  const grid = document.getElementById('grid');

  let items = [];
  try {
    const res = await fetch('manifest.json', { cache: 'no-store' });
    items = await res.json();
  } catch (e) {
    console.error('manifest.json을 불러오지 못했습니다', e);
    items = [];
  }

  function render(list) {
    grid.innerHTML = '';
    for (const item of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = 'entries/' + item.file;
      a.target = '_blank';
      a.rel = 'noopener';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const iframe = document.createElement('iframe');
      iframe.src = 'entries/' + item.file;
      iframe.loading = 'lazy';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      thumb.appendChild(iframe);

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.author || '';
      overlay.appendChild(name);
      thumb.appendChild(overlay);

      a.appendChild(thumb);
      grid.appendChild(a);
    }

    requestAnimationFrame(() => {
      document.querySelectorAll('.thumb').forEach(box => {
        const iframe = box.querySelector('iframe');
        const scale = box.clientWidth / 1280;
        iframe.style.transform = `scale(${scale})`;
      });
    });
  }

  render(items);
  window.addEventListener('resize', () => render(items));
}

main();
</script>
</body>
</html>
