<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive Gallery</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --card-border: #2a2e38;
    --text: #e8eaed;
    --text-dim: #9aa0aa;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  header {
    padding: 40px 24px 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  #toolbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 8px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  #search {
    flex: 1;
    max-width: 320px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
  }
  #count {
    color: var(--text-dim);
    font-size: 13px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px 64px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #0b0d11;
    pointer-events: none;
  }
  .thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: 0;
    transform-origin: top left;
  }
  .meta {
    padding: 12px 14px 14px;
  }
  .meta .title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .sub {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .meta .desc {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 6px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #empty {
    color: var(--text-dim);
    padding: 60px 0;
    text-align: center;
    display: none;
  }
  #empty code {
    background: var(--card-bg);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>📦 Archive Gallery</h1>
  <p><code>entries/</code> 폴더에 html 파일을 추가하고 push하면 아래 갤러리에 자동으로 나타납니다.</p>
</header>
<div id="toolbar">
  <input id="search" type="text" placeholder="제목/작성자로 검색..." />
  <span id="count"></span>
</div>
<main>
  <div id="grid"></div>
  <div id="empty">아직 항목이 없어요. <code>entries/</code> 폴더에 html 파일을 추가해보세요.</div>
</main>

<script>
async function main() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');
  const count = document.getElementById('count');

  let items = [];
  try {
    const res = await fetch('manifest.json', { cache: 'no-store' });
    items = await res.json();
  } catch (e) {
    console.error('manifest.json을 불러오지 못했습니다', e);
    items = [];
  }

  function render(list) {
    grid.innerHTML = '';
    if (list.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
    }
    for (const item of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = 'entries/' + item.file;
      a.target = '_blank';
      a.rel = 'noopener';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const iframe = document.createElement('iframe');
      iframe.src = 'entries/' + item.file;
      iframe.loading = 'lazy';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      thumb.appendChild(iframe);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const title = document.createElement('p');
      title.className = 'title';
      title.textContent = item.title || item.file;
      const sub = document.createElement('div');
      sub.className = 'sub';
      const author = document.createElement('span');
      author.textContent = item.author || '';
      const date = document.createElement('span');
      date.textContent = item.date ? new Date(item.date).toLocaleDateString('ko-KR') : '';
      sub.appendChild(author);
      sub.appendChild(date);
      meta.appendChild(title);
      meta.appendChild(sub);
      if (item.description) {
        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = item.description;
        meta.appendChild(desc);
      }

      a.appendChild(thumb);
      a.appendChild(meta);
      grid.appendChild(a);
    }
    count.textContent = list.length + '개';

    // scale thumbnails to fit box after layout
    requestAnimationFrame(() => {
      document.querySelectorAll('.thumb').forEach(box => {
        const iframe = box.querySelector('iframe');
        const scale = box.clientWidth / 1280;
        iframe.style.transform = `scale(${scale})`;
      });
    });
  }

  render(items);
  window.addEventListener('resize', () => render(currentList()));

  let currentQuery = '';
  function currentList() {
    if (!currentQuery) return items;
    const q = currentQuery.toLowerCase();
    return items.filter(it =>
      (it.title || '').toLowerCase().includes(q) ||
      (it.author || '').toLowerCase().includes(q)
    );
  }

  search.addEventListener('input', () => {
    currentQuery = search.value.trim();
    render(currentList());
  });
}

main();
</script>
</body>
</html>
