<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot Mask — 깜빡이는 점 마스크</title>
  <meta name="description" content="검정 배경에 흰 점들이 마스크 영역을 채우는 인터랙션. 회색 영역은 큰 점, 빨강 영역은 촘촘한 작은 점으로 깜빡인다." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #panel {
      position: fixed; right: 14px; bottom: 14px;
      background: rgba(0,0,0,0.65); color: #eee;
      padding: 10px 12px; border-radius: 8px;
      font: 11px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
      width: 216px; border: 1px solid #333; z-index: 10;
      backdrop-filter: blur(4px);
    }
    #panel strong { font-size: 12px; color:#fff; }
    #panel label { display:block; margin-top:7px; color:#9a9a9a; }
    #panel input[type=range]{ width:100%; height: 14px; }
    #panel select { width:100%; margin-top:2px; font-size:11px; padding:2px; background:#111; color:#eee; border:1px solid #333; }
    #panel .v { float:right; color:#fff; }
    #panel .sec { margin-top:9px; padding-top:7px; border-top:1px solid #2a2a2a; color:#bbb; font-size:10px; }
    #panel .colorRow { display:flex; align-items:center; gap:6px; margin-top:7px; }
    #panel .colorRow label { margin:0; }
    #panel input[type=color]{ width:26px; height:18px; padding:0; border:none; background:none; cursor:pointer; }
    #panel .hint { margin-top:9px; color:#777; font-size:10px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <strong>Dot Mask</strong>

  <div class="sec">회색 영역 (큰 점)</div>
  <label>점 크기 <span class="v" id="vGSize">7</span></label>
  <input type="range" id="gSize" min="1" max="20" step="0.5" value="7">
  <label>점 간격 <span class="v" id="vGGap">22</span></label>
  <input type="range" id="gGap" min="6" max="60" step="1" value="22">

  <div class="sec">빨강 영역 (작은 점)</div>
  <label>점 크기 <span class="v" id="vRSize">4</span></label>
  <input type="range" id="rSize" min="1" max="20" step="0.5" value="4">
  <label>점 간격 <span class="v" id="vRGap">12</span></label>
  <input type="range" id="rGap" min="4" max="60" step="1" value="12">

  <div class="sec">경계</div>
  <label>경계 흐트러짐 <span class="v" id="vMessy">0.5</span></label>
  <input type="range" id="messy" min="0" max="1" step="0.05" value="0.5">
  <label>번짐 폭 <span class="v" id="vBleed">1.4</span></label>
  <input type="range" id="bleed" min="0" max="3" step="0.1" value="1.4">

  <div class="sec">애니메이션</div>
  <label>깜빡임 속도 <span class="v" id="vSpeed">1.0</span></label>
  <input type="range" id="speed" min="0" max="4" step="0.05" value="1.0">
  <label>깜빡임 세기 <span class="v" id="vAmt">0.7</span></label>
  <input type="range" id="amt" min="0" max="1" step="0.05" value="0.7">
  <label>동조/무작위 <span class="v" id="vSync">0.5</span></label>
  <input type="range" id="sync" min="0" max="1" step="0.05" value="0.5">
  <label>모션 종류</label>
  <select id="motion">
    <option value="random">Random — 무작위 깜빡임</option>
    <option value="wave">Wave — 물결(위치 기반)</option>
    <option value="pulse">Pulse — 전체 맥박</option>
    <option value="scan">Scan — 스캔 라인</option>
  </select>

  <div class="sec">모양</div>
  <label>점 모양</label>
  <select id="shape">
    <option value="square">네모</option>
    <option value="circle">원</option>
  </select>
  <label>모서리 둥글기 <span class="v" id="vRound">0</span></label>
  <input type="range" id="round" min="0" max="10" step="0.5" value="0">
  <div class="colorRow">
    <label>배경</label><input type="color" id="bg" value="#000000">
    <label>점</label><input type="color" id="fg" value="#ffffff">
  </div>

  <div class="hint">H: 패널 숨기기</div>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

const P = {
  gSize: 7, gGap: 22,   // 회색 영역: 큰 점 / 넓은 간격
  rSize: 4, rGap: 12,   // 빨강 영역: 작은 점 / 촘촘한 간격
  messy: 0.5,           // 경계 흐트러짐(위치 지터 + 경계 확률)
  bleed: 1.4,           // 번짐 폭(경계를 감지/스며드는 범위, 격자 배수)
  speed: 1.0, amt: 0.7, sync: 0.5,
  motion: 'random',
  shape: 'square', round: 0,
  bg: '#000000', fg: '#ffffff'
};

function makeRng(s) {
  return function () {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

// ─── 마스크 로드 ──────────────────────────────────────────
let maskData = null, maskW = 0, maskH = 0, maskReady = false;
const maskImg = new Image();
maskImg.onload = () => {
  try {
    maskW = maskImg.naturalWidth;
    maskH = maskImg.naturalHeight;
    const mc = document.createElement('canvas');
    mc.width = maskW; mc.height = maskH;
    const mctx = mc.getContext('2d', { willReadFrequently: true });
    mctx.drawImage(maskImg, 0, 0);
    maskData = mctx.getImageData(0, 0, maskW, maskH).data;
    maskReady = true;
    build();
  } catch (err) {}
};
maskImg.src = MASK_DATA_URI;

// 화면 좌표의 마스크 영역 종류: 'red' | 'gray' | null(빈 공간)
function regionAt(x, y) {
  if (!maskReady) return null;
  const mx = Math.floor((x / W) * maskW);
  const my = Math.floor((y / H) * maskH);
  if (mx < 0 || mx >= maskW || my < 0 || my >= maskH) return null;
  const idx = (my * maskW + mx) * 4;
  const r = maskData[idx], g = maskData[idx + 1], b = maskData[idx + 2], a = maskData[idx + 3];
  if (a < 128) return null;
  // 흰색(빈 공간): 세 채널 모두 밝음
  if (r > 200 && g > 200 && b > 200) return null;
  // 빨강: R이 크고 G,B는 작음
  if (r > 150 && g < 120 && b < 120) return 'red';
  // 그 외 중간 밝기(회색)
  return 'gray';
}

// ─── 점 생성 ──────────────────────────────────────────────
// 회색/빨강 영역을 각자의 격자 간격으로 스캔해 점을 배치.
// 각 점: x, y, size, phase(깜빡임 위상), speedJitter
let dots = [];

function build() {
  dots = [];
  if (!maskReady) return;
  const rng = makeRng(9182);

  // 두 영역을 각각의 격자로 채운다.
  addDotsForRegion('gray', P.gGap, P.gSize, rng);
  addDotsForRegion('red',  P.rGap, P.rSize, rng);
}

// 주변을 샘플링해 경계 근접도(0=영역 내부, 1=경계에 딱 붙음)를 추정.
// radius(px) 반경에서 다른 영역/빈공간이 얼마나 섞였는지 비율로.
function edgeFactor(x, y, region, radius) {
  let diff = 0, total = 0;
  const samples = [
    [radius, 0], [-radius, 0], [0, radius], [0, -radius],
    [radius * 0.7, radius * 0.7], [-radius * 0.7, radius * 0.7],
    [radius * 0.7, -radius * 0.7], [-radius * 0.7, -radius * 0.7]
  ];
  for (const [dx, dy] of samples) {
    total++;
    if (regionAt(x + dx, y + dy) !== region) diff++;
  }
  return diff / total; // 0~1
}

function addDotsForRegion(region, gap, size, rng) {
  const messy = P.messy;
  // 위치 지터 폭: messy에 비례. 격자 간격의 최대 ~55%까지 흔듦.
  const jitterAmp = gap * 0.55 * messy;
  // 경계 감지/번짐 범위(px)
  const bleedR = gap * (0.5 + P.bleed);

  for (let y = gap / 2; y < H; y += gap) {
    for (let x = gap / 2; x < W; x += gap) {
      // 위치를 먼저 흔든다(경계 직선 완화)
      const jx = (rng() - 0.5) * 2 * jitterAmp;
      const jy = (rng() - 0.5) * 2 * jitterAmp;
      const px = x + jx, py = y + jy;

      const here = regionAt(px, py);

      // 이 점이 해당 영역인지 판단하되, 경계 근처는 확률적으로 처리해 스며들게 함.
      let belongs;
      if (here === region) {
        // 영역 내부지만 경계에 가까우면 messy에 비례해 확률적으로 누락 → 가장자리가 성기게
        const ef = edgeFactor(px, py, region, bleedR);
        // ef가 클수록(경계에 붙을수록) 빠질 확률 증가
        const dropChance = ef * messy * 0.7;
        belongs = rng() > dropChance;
      } else if (here === null && region !== null) {
        // 빈 공간이지만, 바로 옆이 이 영역이면 messy 확률로 살짝 넘쳐 배치(번짐)
        const ef = 1 - edgeFactor(px, py, region, bleedR); // 이 영역이 주변에 많을수록 큼
        const spillChance = ef * messy * 0.35;
        belongs = rng() < spillChance;
      } else {
        // 다른 색 영역: 경계에서 아주 살짝만 섞임
        const ef = 1 - edgeFactor(px, py, region, bleedR);
        const mixChance = ef * messy * 0.15;
        belongs = rng() < mixChance;
      }

      if (!belongs) continue;

      // 크기도 살짝 편차(경계에서 더 흐트러진 느낌)
      const sizeVar = 1 + (rng() - 0.5) * messy * 0.5;

      dots.push({
        x: px, y: py, size: Math.max(1, size * sizeVar),
        phase: rng() * Math.PI * 2,
        jit: 0.6 + rng() * 0.8,           // 개별 속도 편차
        nextFlip: rng() * 1.5,            // random 모드용 타이머
        level: rng(),
        target: rng()
      });
    }
  }
}

// ─── 깜빡임 밝기 계산 ─────────────────────────────────────
function dotBrightness(d, t, dt) {
  const amt = P.amt;      // 0이면 안 깜빡, 1이면 완전히 껐다 켬
  const base = 1 - amt;   // 최소 밝기
  const spd = P.speed;
  const sync = P.sync;    // 0이면 위치/개별 위상 크게 반영(무작위), 1이면 동조

  switch (P.motion) {
    case 'random': {
      // 개별 타이머로 목표 밝기를 새로 뽑고 부드럽게 이동
      d.nextFlip -= dt * spd * d.jit;
      if (d.nextFlip <= 0) {
        d.target = Math.random();
        d.nextFlip = 0.1 + Math.random() * 1.4;
      }
      d.level += (d.target - d.level) * Math.min(1, 0.15 * (0.5 + spd));
      const v = base + amt * d.level;
      return v;
    }
    case 'wave': {
      // 위치 기반 사인파: 대각선으로 물결이 지나감
      const k = 0.015;
      const phase = (d.x + d.y) * k - t * 2 * spd + d.phase * (1 - sync);
      const s = (Math.sin(phase) * 0.5 + 0.5);
      return base + amt * s;
    }
    case 'pulse': {
      // 전체가 같이 맥박(동조 높음). sync 낮으면 개별 위상 흩어짐
      const s = Math.sin(t * 3 * spd - d.phase * (1 - sync) * 3) * 0.5 + 0.5;
      return base + amt * s;
    }
    case 'scan': {
      // 위→아래로 밝은 띠가 훑고 지나감
      const period = H * 1.2;
      const scanY = ((t * 200 * spd) % period);
      const dist = Math.abs(d.y - scanY);
      const band = 90;
      let s = Math.max(0, 1 - dist / band);
      // sync 낮으면 개별 반짝임 살짝 추가
      s = s * (0.7 + 0.3 * (Math.sin(t * 6 * spd + d.phase) * 0.5 + 0.5)) * (1 - sync * 0) ;
      return base + amt * s;
    }
    default:
      return 1;
  }
}

// ─── 렌더 ─────────────────────────────────────────────────
let start = performance.now();
let last = start;

function draw(now) {
  requestAnimationFrame(draw);
  const t = (now - start) / 1000;
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;

  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  const fg = P.fg;
  const shape = P.shape;
  const round = P.round;

  for (const d of dots) {
    let v = dotBrightness(d, t, dt);
    if (v <= 0.02) continue;
    v = v > 1 ? 1 : v;

    ctx.globalAlpha = v;
    ctx.fillStyle = fg;
    const s = d.size;
    const x = d.x - s / 2, y = d.y - s / 2;

    if (shape === 'circle') {
      ctx.beginPath();
      ctx.arc(d.x, d.y, s / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (round > 0) {
      const r = Math.min(round, s / 2);
      roundRect(x, y, s, s, r); ctx.fill();
    } else {
      ctx.fillRect(x, y, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ─── 컨트롤 ───────────────────────────────────────────────
const rangeMap = {
  gSize:'vGSize', gGap:'vGGap', rSize:'vRSize', rGap:'vRGap',
  messy:'vMessy', bleed:'vBleed',
  speed:'vSpeed', amt:'vAmt', sync:'vSync', round:'vRound'
};
for (const key in rangeMap) {
  const input = document.getElementById(key);
  input.addEventListener('input', () => {
    P[key] = parseFloat(input.value);
    document.getElementById(rangeMap[key]).textContent = input.value;
    // 격자/크기/경계 바뀌면 점 재생성
    if (['gSize','gGap','rSize','rGap','messy','bleed'].includes(key)) build();
  });
}

document.getElementById('motion').addEventListener('change', (e) => { P.motion = e.target.value; });
document.getElementById('shape').addEventListener('change', (e) => { P.shape = e.target.value; });

const bgIn = document.getElementById('bg');
const fgIn = document.getElementById('fg');
bgIn.addEventListener('input', () => { P.bg = bgIn.value; document.body.style.background = P.bg; });
fgIn.addEventListener('input', () => { P.fg = fgIn.value; });

window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    const p = document.getElementById('panel');
    p.style.display = (p.style.display === 'none') ? 'block' : 'none';
  }
});

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  build();
}
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(draw);
</script>
</body>
