<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squares in Region — 색 조절 가능</title>
  <meta name="description" content="mask 영역을 따라 배치된 사각형이 지글대는 인터랙션. 배경색과 사각형 색을 자유롭게 바꿀 수 있어요." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #fff; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 14px; left: 14px;
      background: rgba(255,255,255,0.85); color: #222;
      padding: 12px 14px; border-radius: 8px;
      font: 12px/1.5 -apple-system, sans-serif; min-width: 200px;
      border: 1px solid #ddd;
    }
    #panel label { display:block; margin-top:8px; color:#666; }
    #panel input[type=range]{ width:100%; }
    #panel .v { float:right; color:#000; }
    #panel .hint { margin-top:10px; color:#999; font-size:11px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <strong>Squares</strong>
  <label>사각형 크기 <span class="v" id="vSize">12</span></label>
  <input type="range" id="size" min="4" max="30" step="1" value="12">
  <label>간격 <span class="v" id="vGap">6</span></label>
  <input type="range" id="gap" min="0" max="30" step="1" value="6">
  <label>위치 삐뚤(정적) <span class="v" id="vPos">3</span></label>
  <input type="range" id="pos" min="0" max="15" step="0.5" value="3">
  <label>각도 삐뚤 <span class="v" id="vRot">10</span></label>
  <input type="range" id="rot" min="0" max="45" step="1" value="10">
  <label>크기 편차 <span class="v" id="vSj">0</span></label>
  <input type="range" id="sj" min="0" max="20" step="0.5" value="0">
  <label>지글 범위 <span class="v" id="vJig">2</span></label>
  <input type="range" id="jig" min="0" max="10" step="0.5" value="2">
  <label>지글 속도 <span class="v" id="vSpd">14</span></label>
  <input type="range" id="spd" min="1" max="30" step="1" value="14">
  <label>배경 색 <input type="color" id="bg" value="#ffffff" style="float:right;width:40px;height:20px;padding:0;border:none;background:none;cursor:pointer;"></label>
  <label>사각형 색 <input type="color" id="fg" value="#000000" style="float:right;width:40px;height:20px;padding:0;border:none;background:none;cursor:pointer;"></label>
  <div class="hint">H 키: 패널 숨기기 / 표시</div>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

const P = { size: 12, gap: 6, pos: 3, rot: 10, sj: 0, jig: 2, spd: 14, bg: '#ffffff', fg: '#000000' };

function makeRng(seed) {
  return function () {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  };
}

// ─── mask.png 기반 영역 판정 ──────────────────────────────
// mask.png의 픽셀을 읽어서: 검정 픽셀 위치 = 사각형 배치, 흰색 = 제외.
// 이미지를 오프스크린 캔버스에 그려 픽셀 데이터를 샘플링한다.
let maskCanvas = null, maskCtx = null, maskData = null, maskW = 0, maskH = 0, maskReady = false;

let maskError = '';
const maskImg = new Image();
maskImg.onload = () => {
  try {
    maskW = maskImg.naturalWidth;
    maskH = maskImg.naturalHeight;
    maskCanvas = document.createElement('canvas');
    maskCanvas.width = maskW;
    maskCanvas.height = maskH;
    maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
    maskCtx.drawImage(maskImg, 0, 0);
    maskData = maskCtx.getImageData(0, 0, maskW, maskH).data;
    maskReady = true;
    build();
  } catch (err) {
    maskError = 'getImageData 실패: ' + err.message;
  }
};
maskImg.onerror = () => { maskError = '이미지 로드 실패 (경로/파일 확인)'; };
maskImg.src = MASK_DATA_URI;

// 반전 토글: true면 판정 반대로
let INVERT = false;
window.addEventListener('keydown', (e) => {
  if (e.key === 'i' || e.key === 'I') { INVERT = !INVERT; build(); }
});

// 화면 좌표(x,y)가 "제외 영역"인지 (mask.png 기준)
function inRoad(x, y) {
  if (!maskReady) return true;
  const mx = Math.floor((x / W) * maskW);
  const my = Math.floor((y / H) * maskH);
  if (mx < 0 || mx >= maskW || my < 0 || my >= maskH) return true;
  const idx = (my * maskW + mx) * 4;
  const brightness = maskData[idx];   // R 채널
  const alpha = maskData[idx + 3];    // 알파 채널

  // "칠해진 부분" 판정: 알파가 있고(불투명) 어두운(검정) 곳 = 배치 영역
  // 투명하거나 밝은 곳 = 제외
  let painted = (alpha > 128) && (brightness < 128);
  let exclude = !painted; // painted면 배치(exclude=false)

  if (INVERT) exclude = !exclude;
  return exclude;
}

// ─── 사각형 배치 (빨간 영역 = 길 밖) ──────────────────────
let squares = [];

function build() {
  squares = [];
  const rng = makeRng(12345);
  const step = P.size + P.gap;
  const cols = Math.ceil(W / step) + 1;
  const rows = Math.ceil(H / step) + 1;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const baseX = c * step + P.size / 2;
      const baseY = r * step + P.size / 2;

      // 길 안이면 스킵 (약간 여유 두고 판정)
      if (inRoad(baseX, baseY)) { rng(); rng(); rng(); rng(); continue; }

      squares.push({
        x: baseX + (rng() - 0.5) * 2 * P.pos,
        y: baseY + (rng() - 0.5) * 2 * P.pos,
        rot: (rng() - 0.5) * 2 * P.rot * Math.PI / 180,
        size: Math.max(1, P.size + (rng() - 0.5) * 2 * P.sj),
        phase: rng() * Math.PI * 2,
        phase2: rng() * Math.PI * 2
      });
    }
  }
}

// ─── 렌더 ─────────────────────────────────────────────────
function draw() {
  requestAnimationFrame(draw);
  const t = performance.now() / 1000;

  // 배경
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  // 사각형
  ctx.fillStyle = P.fg;
  for (const s of squares) {
    // 좁은 범위 빠른 지글지글
    const jx = Math.sin(t * P.spd + s.phase) * P.jig;
    const jy = Math.cos(t * P.spd * 1.1 + s.phase2) * P.jig;
    const jr = Math.sin(t * P.spd * 0.9 + s.phase) * 0.04;

    ctx.save();
    ctx.translate(s.x + jx, s.y + jy);
    ctx.rotate(s.rot + jr);
    ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
    ctx.restore();
  }
}

// ─── 컨트롤 ───────────────────────────────────────────────
const map = { size:'vSize', gap:'vGap', pos:'vPos', rot:'vRot', sj:'vSj', jig:'vJig', spd:'vSpd' };
for (const key in map) {
  const input = document.getElementById(key);
  input.addEventListener('input', () => {
    P[key] = parseFloat(input.value);
    document.getElementById(map[key]).textContent = input.value;
    // 지글 범위/속도는 배치 재생성 불필요
    if (key !== 'jig' && key !== 'spd') build();
  });
}

// 색상 컨트롤 (배치 재생성 불필요 — 다음 프레임에 바로 반영)
const bgInput = document.getElementById('bg');
const fgInput = document.getElementById('fg');
bgInput.addEventListener('input', () => {
  P.bg = bgInput.value;
  document.body.style.background = P.bg; // 캔버스 밖 여백도 맞춤
});
fgInput.addEventListener('input', () => {
  P.fg = fgInput.value;
});

// 패널 숨기기 (녹화용)
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    const p = document.getElementById('panel');
    p.style.display = (p.style.display === 'none') ? 'block' : 'none';
  }
});

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  build();
}
window.addEventListener('resize', resize);

resize();
draw();
</script>
</body>
</html>
