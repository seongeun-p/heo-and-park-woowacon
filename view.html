<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>허앤박 우아콘</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  #bar {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: #000;
    border-bottom: 1px solid #222;
  }
  #bar a {
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #frame-wrap {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    bottom: 0;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<div id="bar">
  <a href="index.html">← 허앤박 우아콘</a>
</div>
<div id="frame-wrap">
  <iframe id="content" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  if (src) {
    document.getElementById('content').src = src;
  }
</script>
</body>
</html>
